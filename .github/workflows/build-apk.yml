name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Triggered on release tags like v1.0.0, v1.0.1, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write # Required to create a GitHub Release and upload assets

jobs:
  eas-build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 🚀 Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Typecheck code
        run: npx tsc --noEmit

      - name: 🔍 Lint code
        run: npm run lint

      - name: 📱 Build Android APK on EAS Cloud
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build-report.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Parse and Download APK
        id: parse-build
        run: |
          cat build-report.json
          BUILD_STATUS=$(jq -r '.[0].status // .status' build-report.json)
          if [ "$BUILD_STATUS" != "FINISHED" ]; then
            echo "EAS Build failed with status: $BUILD_STATUS"
            exit 1
          fi

          APK_URL=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // .artifacts.applicationArchiveUrl // .artifacts.buildUrl' build-report.json)
          echo "Downloading APK from: $APK_URL"
          curl -L --fail "$APK_URL" -o WearWise.apk

      - name: 🏷 Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: WearWise ${{ steps.release_info.outputs.TAG }}
          files: WearWise.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
